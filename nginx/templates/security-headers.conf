# Заголовки безопасности, общие для всех location.
#
# Почему отдельным файлом, а не один раз на уровне server: в nginx add_header
# НЕ наследуется в location, где есть свой add_header. Стоило добавить
# Cache-Control в /assets/ — и оттуда пропадали nosniff и HSTS. Поэтому файл
# подключается в каждый блок явно.
#
# Лежит в каталоге templates/, но без суффикса .template: штатный
# docker-entrypoint прогоняет через envsubst только *.template, а здесь
# подставлять нечего — переменных нет.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# Сайт нельзя поместить в чужой iframe: и заголовок, и директива CSP —
# старые браузеры понимают только первое.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP — главная страховка на случай XSS.
#   script-src 'self'          — только собранные Vite бандлы, никакого inline;
#   img/media storage.yandex…  — /media/ отвечает редиректом в хранилище;
#   style-src 'unsafe-inline'  — Tailwind и inline-стили в компонентах;
#   'self' покрывает и wss://  — по CSP3 для https-origin это тот же источник.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://storage.yandexcloud.net data: blob:; media-src 'self' https://storage.yandexcloud.net blob:; connect-src 'self' https://storage.yandexcloud.net; font-src 'self' data:; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
