events {
    worker_connections 1024;
}

http {
    # Согласовано с лимитами в src/chats/service.py (видео — 200 МБ).
    client_max_body_size 200M;

    # HTTP → HTTPS редирект
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # add_header не наследуется в location со своим add_header, поэтому
        # набор заголовков подключается в каждый блок явно.
        include /etc/nginx/security-headers.conf;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # Медиа отдаёт приложение: оно проверяет, что пользователь вошёл, и
        # подписывает временную ссылку. Прямого проксирования в бакет больше
        # нет — раньше так наружу раздавалось всё его содержимое.
        location /media/ {
            proxy_pass http://fastapi:8000;
            proxy_set_header X-Real-IP $remote_addr;
            include /etc/nginx/security-headers.conf;
        }

        # Загрузка файлов — увеличенный таймаут для больших видео
        location ~* ^/chats/[^/]+/upload$ {
            proxy_pass http://fastapi:8000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            include /etc/nginx/security-headers.conf;
        }

        # Обычные HTTP запросы
        location / {
            proxy_pass http://fastapi:8000;
            proxy_set_header X-Real-IP $remote_addr;
            include /etc/nginx/security-headers.conf;
        }

        # WebSocket
        location /chats/ws/ {
            proxy_pass http://fastapi:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            include /etc/nginx/security-headers.conf;
        }
    }
}
